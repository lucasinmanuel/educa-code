<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - EducaCode</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar quiz-topbar">
      <div class="topbar-inner">
        <a class="logo" href="index.html">&lt;/&gt; EducaCode</a>
        <nav class="site-nav">
          <a href="index.html">Início</a>
          <a href="aprender.html">Aprender</a>
          <a href="pratica.html">Praticar</a>
        </nav>
        <div class="score-pill" id="scorePill">Perguntas &middot; <span id="scoreValue">0</span> de <span id="scoreMax">0</span> pontos</div>
      </div>
    </header>

    <!-- Anuncia o resultado de cada resposta para leitores de tela. -->
    <div id="srAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <main class="quiz-main">
      <div class="quiz-heading">
        <h1 id="quizTitle" class="quiz-title"></h1>
        <span id="bestBadge" class="best-badge hidden"></span>
      </div>
      <nav id="levelTabs" class="level-tabs" aria-label="Dificuldade"></nav>
      <nav id="faseTabs" class="fase-tabs" aria-label="Fase"></nav>
      <div id="questionList" class="question-list"></div>

      <div id="resultBanner" class="result-banner hidden">
        <p id="resultText"></p>
        <p id="bestText" class="best-text hidden"></p>
        <div class="result-actions">
          <a id="nextFaseBtn" class="btn btn-primary hidden" href="#"></a>
          <button id="retryBtn" class="btn btn-secondary">Refazer</button>
          <a href="index.html" class="btn btn-secondary">Escolher outro módulo</a>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Este conteúdo não foi criado nem aprovado por terceiros. Feito para fins educativos.</p>
      <p class="license-note">Licenciado sob <a href="LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a></p>
      <div class="author">
        <img class="author-photo" src="https://github.com/lucasinmanuel.png" alt="Foto de Lucas Emanuel Santana dos Santos">
        <div class="author-info">
          <span class="author-name">Lucas Emanuel Santana dos Santos</span>
          <div class="author-links">
            <a href="https://www.linkedin.com/in/lucasinmanuel/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <span class="author-sep">&middot;</span>
            <a href="https://github.com/lucasinmanuel" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/acronyms.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/fases.js"></script>
  <script src="js/questions-html.js"></script>
  <script src="js/questions-css.js"></script>
  <script src="js/questions-js.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
